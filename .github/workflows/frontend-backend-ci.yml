# CI/CD workflow for Bitcoin Testnet Generator backend
name: Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  backend:
    name: Backend CI/CD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint Backend
        run: |
          if [ -f app.py ]; then python -m py_compile app.py; fi

      - name: Run Backend Tests
        run: |
          TEST_FILES=$(find tests -name "test_*.py" -type f 2>/dev/null)
          if [ -n "$TEST_FILES" ]; then
            python -m unittest discover -s tests --failfast
          else
            echo "No backend tests found"
          fi

      - name: Deploy Backend
        if: success()
        env:
          DEPLOY_API_KEY: ${{ secrets.DEPLOY_API_KEY }}
        run: |
          echo "Deploying backend to production... [Add actual deployment steps here.]"
